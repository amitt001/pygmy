# Fresh SQLite installation. Existing PostgreSQL installations should retain
# their database service and restore/upgrade it separately; do not reuse an old
# PostgreSQL data volume with a different major version.
x-app: &app
  build: .
  image: pygmy:local
  restart: unless-stopped
  user: '10001:10001'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=16m,mode=1777]
  mem_limit: 128m
  cpus: 0.25
  pids_limit: 64
  logging:
    driver: local
    options: {max-size: 5m, max-file: '3'}
  networks: [app]

services:
  pygmy:
    <<: *app
    environment:
      PYGMY_SECRET_KEY: ${PYGMY_SECRET_KEY:?Set a unique API secret}
      PYGMY_DEMO_MODE: ${PYGMY_DEMO_MODE:-0}
    volumes: [data:/pygmy/pygmy/data]
    command: [gunicorn, --bind, '0.0.0.0:9119', --workers, '1', --access-logfile, '-', pygmy.rest.wsgi:app]
  pygmyui:
    <<: *app
    ports: ['127.0.0.1:8000:8000']
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique UI secret}
      PYGMY_API_ADDRESS: pygmy
      PYGMY_DEMO_MODE: ${PYGMY_DEMO_MODE:-0}
      PYGMY_ALLOWED_HOSTS: ${PYGMY_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PYGMY_PUBLIC_URL: ${PYGMY_PUBLIC_URL:-http://localhost:8000}
      PYGMY_COOKIE_SECURE: ${PYGMY_COOKIE_SECURE:-1}
      PYGMY_TRUST_PROXY: ${PYGMY_TRUST_PROXY:-0}
      PYGMY_CSRF_ORIGINS: ${PYGMY_CSRF_ORIGINS:-}
    command: [gunicorn, --chdir, pygmyui, --bind, '0.0.0.0:8000', --workers, '1', --access-logfile, '-', pygmyui.wsgi]
    depends_on: [pygmy]
volumes:
  data:
networks:
  app:
    internal: true
