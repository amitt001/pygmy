name: Tests and dependency audit
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest pip-audit
      - run: python -m unittest test_security
      - run: python -m pytest -q pygmy/tests
        env:
          PYGMY_SECRET_KEY: synthetic-ci-test-key-never-for-production
      - run: pip-audit -r requirements.txt
